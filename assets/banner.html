<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:440px; }
  body {
    font-family:"PingFang SC","Helvetica Neue","Segoe UI",Arial,sans-serif;
    background:#0B0E14;
    position:relative;
    overflow:hidden;
    color:#E8EBF0;
  }
  /* 背景网格 */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(120,140,180,0.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,140,180,0.05) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 90% 80% at 30% 40%,#000 40%,transparent 78%);
  }
  /* 右侧光晕 */
  .glow {
    position:absolute; right:-160px; top:-120px;
    width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle,rgba(88,101,242,0.28),rgba(88,101,242,0) 62%);
  }
  .glow2 {
    position:absolute; right:120px; bottom:-220px;
    width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle,rgba(45,212,191,0.20),rgba(45,212,191,0) 62%);
  }

  .wrap { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }

  /* 顶部小标签 */
  .top { display:flex; align-items:center; gap:14px; }
  .dot { width:11px; height:11px; border-radius:50%; background:#2DD4BF; box-shadow:0 0 14px rgba(45,212,191,0.9); }
  .kicker { font-size:16px; letter-spacing:5px; color:#8B95A7; font-weight:500; text-transform:uppercase; }

  /* 主标题 */
  h1 {
    margin-top:34px;
    font-size:78px; line-height:1.02; font-weight:800; letter-spacing:-1px;
    color:#FFFFFF;
  }
  h1 .accent {
    background:linear-gradient(92deg,#8B93FF,#5865F2 40%,#2DD4BF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub {
    margin-top:22px; font-size:25px; line-height:1.5; color:#AEB6C6; font-weight:400; max-width:760px;
  }
  .sub b { color:#E8EBF0; font-weight:600; }

  /* 底部标签条 */
  .tags { margin-top:auto; display:flex; gap:14px; align-items:center; }
  .tag {
    display:flex; align-items:center; gap:9px;
    padding:11px 20px; border-radius:999px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.11);
    font-size:18px; color:#C7CEDB; font-weight:500;
  }
  .tag .g { width:8px; height:8px; border-radius:50%; }

  /* 右侧声波 */
  .wave { position:absolute; right:70px; top:0; bottom:0; display:flex; align-items:center; gap:9px; }
  .wave i {
    display:block; width:9px; border-radius:6px;
    background:linear-gradient(180deg,#8B93FF,#2DD4BF);
    opacity:0.92;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="wave" id="wave"></div>

  <div class="wrap">
    <div class="top">
      <span class="dot"></span>
      <span class="kicker">Voice Cloning&nbsp;·&nbsp;Zero-shot TTS</span>
    </div>

    <h1>CosyVoice2 <span class="accent">on Mac</span></h1>

    <div class="sub">一段参考音频，<b>克隆音色</b>，给任意文字配音。<br>纯本地运行，Apple Silicon 加速，clone 下来一键复现。</div>

    <div class="tags">
      <span class="tag"><span class="g" style="background:#5865F2"></span>Apple Silicon · MPS</span>
      <span class="tag"><span class="g" style="background:#2DD4BF"></span>零样本克隆</span>
      <span class="tag"><span class="g" style="background:#F5A623"></span>纯本地 · 离线免费</span>
      <span class="tag"><span class="g" style="background:#E0507A"></span>一键安装</span>
    </div>
  </div>

<script>
  // 生成右侧声波柱，高度呈自然起伏
  const wave = document.getElementById('wave');
  const heights = [40,72,120,86,150,210,130,190,96,150,74,116,58,92,44,150,232,150,96,60,150,110,66];
  heights.forEach(h => {
    const bar = document.createElement('i');
    bar.style.height = h + 'px';
    wave.appendChild(bar);
  });
</script>
</body>
</html>
